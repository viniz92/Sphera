image:
  backend:
    repository: ghcr.io/viniz92/sphera-backend
    tag: latest
    pullPolicy: Always
  frontend:
    repository: ghcr.io/viniz92/sphera-frontend
    tag: latest
    pullPolicy: Always

clusterName: "seru-dev"
awsRegion: "us-east-1"
prometheusUrl: "http://prometheus-server.monitoring.svc.cluster.local"

ingress:
  enabled: true
  className: ""
  host: sphera.dev.plataformaseru.com.br
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: dev-external
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-1:628979431132:certificate/15e0673c-3416-4e22-bbf4-117762dda654
    alb.ingress.kubernetes.io/actions.ssl-redirect: '{"Type": "redirect", "RedirectConfig": {"Protocol": "HTTPS", "Port": "443", "StatusCode": "HTTP_301"}}'
  tls:
    enabled: false

auth:
  username: "admin"
  password: "admin"

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0a0520"/>
      <stop offset="60%" stop-color="#060610"/>
      <stop offset="100%" stop-color="#03030a"/>
    </radialGradient>
    <radialGradient id="orb-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0840" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06060F" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="orb-clip"><circle cx="640" cy="290" r="68"/></clipPath>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bg)"/>

  <!-- Stars -->
  <g opacity="0.7">
    <circle cx="120" cy="45" r="1" fill="#fff" opacity="0.5"/>
    <circle cx="340" cy="88" r="0.8" fill="#fff" opacity="0.35"/>
    <circle cx="78" cy="160" r="1.2" fill="#a0b8ff" opacity="0.6"/>
    <circle cx="520" cy="32" r="0.9" fill="#fff" opacity="0.45"/>
    <circle cx="890" cy="60" r="1.1" fill="#fff" opacity="0.55"/>
    <circle cx="1100" cy="120" r="0.8" fill="#a0b8ff" opacity="0.4"/>
    <circle cx="1200" cy="55" r="1.3" fill="#fff" opacity="0.5"/>
    <circle cx="200" cy="280" r="0.7" fill="#fff" opacity="0.3"/>
    <circle cx="1050" cy="300" r="1" fill="#fff" opacity="0.45"/>
    <circle cx="960" cy="180" r="0.9" fill="#a0b8ff" opacity="0.5"/>
    <circle cx="420" cy="220" r="0.8" fill="#fff" opacity="0.35"/>
    <circle cx="150" cy="400" r="1.2" fill="#fff" opacity="0.5"/>
    <circle cx="1150" cy="420" r="0.9" fill="#fff" opacity="0.4"/>
    <circle cx="55" cy="510" r="1" fill="#a0b8ff" opacity="0.45"/>
    <circle cx="1220" cy="560" r="0.8" fill="#fff" opacity="0.35"/>
    <circle cx="300" cy="600" r="1.1" fill="#fff" opacity="0.5"/>
    <circle cx="980" cy="650" r="0.9" fill="#fff" opacity="0.4"/>
    <circle cx="700" cy="680" r="0.7" fill="#a0b8ff" opacity="0.3"/>
    <circle cx="450" cy="520" r="1" fill="#fff" opacity="0.35"/>
    <circle cx="830" cy="400" r="0.8" fill="#fff" opacity="0.4"/>
    <circle cx="640" cy="120" r="0.9" fill="#fff" opacity="0.45"/>
    <circle cx="760" cy="200" r="1" fill="#a0b8ff" opacity="0.5"/>
    <circle cx="180" cy="660" r="0.8" fill="#fff" opacity="0.35"/>
    <circle cx="1080" cy="680" r="1.1" fill="#fff" opacity="0.5"/>
    <circle cx="580" cy="640" r="0.7" fill="#fff" opacity="0.3"/>
    <circle cx="38" cy="340" r="0.9" fill="#a0b8ff" opacity="0.4"/>
    <circle cx="1240" cy="350" r="0.8" fill="#fff" opacity="0.35"/>
    <circle cx="720" cy="50" r="1.2" fill="#fff" opacity="0.55"/>
    <circle cx="260" cy="140" r="0.8" fill="#fff" opacity="0.4"/>
    <circle cx="1010" cy="490" r="1" fill="#a0b8ff" opacity="0.45"/>
  </g>

  <!-- Orb glow halo -->
  <circle cx="640" cy="290" r="130" fill="url(#orb-glow)" opacity="0.6"/>

  <!-- Orb base -->
  <circle cx="640" cy="290" r="68" fill="#06060F" clip-path="url(#orb-clip)"/>
  <!-- Orb latitude lines -->
  <ellipse cx="640" cy="290" rx="68" ry="18" fill="none" stroke="#1E2E5A" stroke-width="0.9" opacity="0.55" clip-path="url(#orb-clip)"/>
  <ellipse cx="640" cy="290" rx="68" ry="38" fill="none" stroke="#1E2E5A" stroke-width="0.7" opacity="0.35" clip-path="url(#orb-clip)"/>
  <ellipse cx="640" cy="290" rx="22" ry="68" fill="none" stroke="#1E2E5A" stroke-width="0.8" opacity="0.45" clip-path="url(#orb-clip)"/>
  <!-- Inner shadow -->
  <circle cx="640" cy="300" r="50" fill="#100820" opacity="0.65" clip-path="url(#orb-clip)"/>
  <!-- Nazgul body -->
  <path d="M640 232 C636 236 632 241 630 247 C628 253 627 260 627 268 C626 276 626 284 627 292 C628 300 630 307 632 313 C634 319 636 323 638 326 C639 328 640 329 640 329 C640 329 641 328 642 326 C644 323 646 319 648 313 C650 307 652 300 653 292 C654 284 654 276 653 268 C653 260 652 253 650 247 C648 241 644 236 640 232Z" fill="#0E0E20" clip-path="url(#orb-clip)"/>
  <!-- Eyes glow -->
  <ellipse cx="633" cy="268" rx="5" ry="3.5" fill="#CC3000" opacity="0.9" filter="url(#glow)"/>
  <ellipse cx="647" cy="268" rx="5" ry="3.5" fill="#CC3000" opacity="0.9" filter="url(#glow)"/>
  <ellipse cx="633" cy="268" rx="3" ry="2" fill="#FF5500"/>
  <ellipse cx="647" cy="268" rx="3" ry="2" fill="#FF5500"/>
  <ellipse cx="633" cy="268" rx="1.3" ry="1" fill="#FFB030"/>
  <ellipse cx="647" cy="268" rx="1.3" ry="1" fill="#FFB030"/>
  <!-- Orb border -->
  <circle cx="640" cy="290" r="68" fill="none" stroke="#1A2A5A" stroke-width="2.5"/>
  <circle cx="640" cy="290" r="68" fill="none" stroke="#2A3A7A" stroke-width="1" opacity="0.4"/>

  <!-- Title -->
  <text x="640" y="400" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="600" fill="#e0e0f0" letter-spacing="6">PALANTIR</text>
  <text x="640" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#4A7FD4" letter-spacing="5">EKS DASHBOARD</text>

  <!-- Form container -->
  <rect x="480" y="448" width="320" height="192" rx="8" fill="none"/>

  <!-- Username field -->
  <rect x="480" y="448" width="320" height="38" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <text x="500" y="472" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#888">Usuário</text>

  <!-- Password field -->
  <rect x="480" y="498" width="320" height="38" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <text x="500" y="522" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#888">Senha</text>

  <!-- Login button -->
  <rect x="480" y="550" width="320" height="40" rx="6" fill="rgba(74,127,212,0.85)"/>
  <text x="640" y="575" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="600" fill="#fff" letter-spacing="1">Entrar</text>
</svg>

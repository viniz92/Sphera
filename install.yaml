apiVersion: v1
kind: Namespace
metadata:
  name: palantir
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: palantir
  namespace: palantir
  annotations: {}
  # Para IRSA (recomendado), adicione:
  # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/palantir-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: palantir
rules:
- apiGroups: [""]
  resources: ["nodes", "namespaces", "pods", "services", "configmaps", "endpoints"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "daemonsets", "statefulsets", "replicasets"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: palantir
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: palantir
subjects:
- kind: ServiceAccount
  name: palantir
  namespace: palantir
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: palantir
  namespace: palantir
spec:
  replicas: 1
  selector:
    matchLabels:
      app: palantir
  template:
    metadata:
      labels:
        app: palantir
    spec:
      serviceAccountName: palantir
      containers:
      - name: backend
        image: ghcr.io/viniz92/palantir-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: RUNNING_IN_CLUSTER
          value: "true"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 30
      - name: frontend
        image: ghcr.io/viniz92/palantir-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: palantir
  namespace: palantir
spec:
  selector:
    app: palantir
  ports:
  - port: 80
    targetPort: 80

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "eks-dashboard.serviceAccountName" . }}
  namespace: {{ include "eks-dashboard.namespace" . }}
  labels:
    {{- include "eks-dashboard.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
# ClusterRole com permissões mínimas necessárias para o dashboard
# Equivalente ao que o Kubecost usa para leitura do cluster
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "eks-dashboard.fullname" . }}
  labels:
    {{- include "eks-dashboard.labels" . | nindent 4 }}
rules:
  # Leitura de recursos de workload (para descobrir addons)
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  # Leitura de pods e namespaces
  - apiGroups: [""]
    resources: ["pods", "namespaces", "nodes", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  # Leitura de Ingress (para detectar URL de acesso dos addons)
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  # Leitura da versão do cluster
  - apiGroups: [""]
    resources: [""]
    verbs: ["get"]
  # Leitura de ConfigMaps (versão do cluster fica em kube-system)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
    resourceNames: ["cluster-info", "kubeadm-config"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "eks-dashboard.fullname" . }}
  labels:
    {{- include "eks-dashboard.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "eks-dashboard.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "eks-dashboard.serviceAccountName" . }}
    namespace: {{ include "eks-dashboard.namespace" . }}
{{- end }}
